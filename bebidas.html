<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Bebidas - SuperMarket Express</title>
</head>
<body>
    <header>
        <div class="logo">
            <h1 class="logo_titulo">SuperMarket Express</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Volver al Inicio</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="productos">
            <h2>Categoría: Bebidas</h2>
            <div class="grid">
                <div class="card">
                    <img src="img/refresco.jpg" alt="Refresco" width="100%">
                    <h3>Refresco</h3>
                    <p>2L</p>
                    <span>$35</span>
                    <br><br>
                    <button>Agregar</button>
                </div>
                <div class="card">
                    <img src="img/resfrescopec.jpg" alt="Refresco pequeño" width="100%">
                    <h3>Refresco</h3>
                    <p>235ml</p>
                    <span>$15</span>
                    <br><br>
                    <button>Agregar</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <small>&copy; Copyright SuperMarket Express 2026</small>
    </footer>
</body>
</html>
