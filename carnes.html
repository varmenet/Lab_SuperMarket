<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Carniceria - SuperMarket Express</title>
</head>
<body>
    <header>
        <div class="logo">
            <h1 class="logo_titulo">SuperMarket Express</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Volver al Inicio</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="productos">
            <h2>Categoría: Carnicería</h2>
            <div class="grid">
                <div class="card">
                    <img src="img/molida.jpg" alt="Carne molida 90-10" width="100%">
                    <h3>Carne molida</h3>
                    <p>1kg</p>
                    <span>$120</span>
                    <br><br>
                    <button>Agregar</button>
                </div>
                <div class="card">
                    <img src="img/milanesa.jpg" alt="Milanesa de carne" width="100%">
                    <h3>Milanesa de carne</h3>
                    <p>500g</p>
                    <span>$85</span>
                    <br><br>
                    <button>Agregar</button>
                </div>
                <div class="card carne-card">
                    <span class="etiqueta-choice">Choice</span>
                    <img src="img/rybye.jpg" alt="Rybye" width="100%">
                    <h3>Rybye</h3>
                    <p>500g</p>
                    <span>$750</span>
                    <br><br>
                    <button>Agregar</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <small>&copy; Copyright SuperMarket Express 2026</small>
    </footer>
</body>
</html>
