<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Frutas y Verduras - SuperMarket Express</title>
</head>
<body>
    <header>
        <div class="logo">
            <h1 class="logo_titulo">SuperMarket Express</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Volver al Inicio</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="productos">
            <h2>Categoría: Frutas y Verduras</h2>
            <div class="grid">
                <div class="card">
                    <img src="img/tomate.jpg" alt="Tomates frescos" width="100%">
                    <h3>Tomate Guaje</h3>
                    <p>1kg</p>
                    <span>$29</span>
                    <br><br>
                    <button>Agregar</button>
                </div>
                <div class="card">
                    <img src="img/manzana.jpg" alt="Manzanas rojas" width="100%">
                    <h3>Manzana Golden</h3>
                    <p>1kg</p>
                    <span>$48</span>
                    <br><br>
                    <button>Agregar</button>
                </div>
                <div class="card">
                    <img src="img/lechugaromana.jpg" alt="Lechuga romana" width="100%">
                    <h3>Lechuga Romana</h3>
                    <p>500g</p>
                    <span>$35</span>
                    <br><br>
                    <button>Agregar</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <small>&copy; Copyright SuperMarket Express 2026</small>
    </footer>
</body>
</html>
