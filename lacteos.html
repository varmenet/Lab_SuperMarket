<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Lácteos - SuperMarket Express</title>
</head>
<body>
    <header>
        <div class="logo">
            <h1 class="logo_titulo">SuperMarket Express</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Volver al Inicio</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="productos">
            <h2>Categoría: Lácteos</h2>
            <div class="grid">
                <div class="card">
                    <img src="img/lecheoferta.jpg" alt="Leche en oferta">
                    <h3>Leche paquete 10</h3>
                    <p class="precio-anterior">$550</p>
                    <p class="precio-actual">$439.99</p>
                    <button>Agregar</button>
                </div>
                <div class="card">
                    <img src="img/leche.jpg" alt="Bote de Leche" width="100%">
                    <h3>Leche</h3>
                    <p>1L</p>
                    <span>$28</span>
                    <br><br>
                    <button>Agregar</button>
                </div>
                <div class="card">
                    <img src="img/yogurt.jpg" alt="Bote de Yogurt" width="100%">
                    <h3>Yogurt</h3>
                    <p>1L</p>
                    <span>$35</span>
                    <br><br>
                    <button>Agregar</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <small>&copy; Copyright SuperMarket Express 2026</small>
    </footer>
</body>
</html>
