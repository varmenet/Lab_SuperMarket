<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Limpieza - SuperMarket Express</title>
</head>
<body>
    <header>
        <div class="logo">
            <h1 class="logo_titulo">SuperMarket Express</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Volver al Inicio</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="productos">
            <h2>Categoría: Limpieza</h2>
            <div class="grid">
                <div class="card">
                    <img src="img/CLORO.jpg" alt="Cloro" width="100%">
                    <h3>Cloro</h3>
                    <p>950ML</p>
                    <span>$15</span>
                    <br><br>
                    <button>Agregar</button>
                </div>
                <div class="card">
                    <img src="img/fabuloso.jpg" alt="Fabuloso" width="100%">
                    <h3>Fabuloso</h3>
                    <p>6.2L</p>
                    <span>$161</span>
                    <br><br>
                    <button>Agregar</button>
                </div>
                <div class="card">
                    <img src="img/pinol.jpg" alt="Pinol" width="100%">
                    <h3>Pinol</h3>
                    <p>828ML</p>
                    <span>$26</span>
                    <br><br>
                    <button>Agregar</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <small>&copy; Copyright SuperMarket Express 2026</small>
    </footer>
</body>
</html>
