<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Panadería - SuperMarket Express</title>
</head>
<body>
    <header>
        <div class="logo">
            <h1 class="logo_titulo">SuperMarket Express</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Volver al Inicio</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="productos">
            <h2>Categoría: Panadería</h2>
            <div class="grid">
                <div class="card">
                    <img src="img/pan.jpg" alt="Barra de Pan Integral" width="100%">
                    <h3>Pan</h3>
                    <p>Integral</p>
                    <span>$45</span>
                    <br><br>
                    <button>Agregar</button>
                </div>
                <div class="card">
                    <img src="img/mediosdias.jpg" alt="Pan Medias Noches bimbo" width="100%">
                    <h3>Pan Medias Noches</h3>
                    <p>8 pzas</p>
                    <span>$40</span>
                    <br><br>
                    <button>Agregar</button>
                </div>
                <div class="card">
                    <img src="img/artesanalpan.jpg" alt="Pan Artesanal" width="100%">
                    <h3>Pan Artesanal</h3>
                    <p>567g Bolsa bimbo</p>
                    <span>$50</span>
                    <br><br>
                    <button>Agregar</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <small>&copy; Copyright SuperMarket Express 2026</small>
    </footer>
</body>
</html>
